services:
  test_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 3s
      timeout: 3s
      retries: 20

  auth_tests:
    build: ./auth_service
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://test:test@test_db:5432/test
      JWT_SECRET: test_secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 5
      APP_ENV: test
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 5
    depends_on:
      test_db:
        condition: service_healthy
    command: >
      sh -c "
      pip install --no-cache-dir -r requirements-dev.txt &&
      alembic upgrade head &&
      pytest -q
      "
